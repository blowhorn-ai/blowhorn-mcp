name: Publish to npm and the MCP Registry

# Started by `make publish` after `make release` created tag v<version>.
# Publishes with provenance through npm trusted publishing (OIDC): npm trusts
# this workflow file in the `npm` environment, so no token is stored. Then
# publishes server.json to the MCP Registry with GitHub OIDC.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, plain X.Y.Z without the v (the tag v<version> must exist)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # A dispatch runs the workflow file from the branch it names, so refuse
      # anything but master outright rather than skip quietly. The `npm`
      # environment's deployment branch rule enforces the same thing.
      - name: Require master
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/master ]; then
            echo "::error::publish runs only from master, not $REF; dispatch it with --ref master"
            exit 1
          fi

      # Plain X.Y.Z only: a prerelease published here would become `latest`.
      - name: Check the version input
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not plain X.Y.Z (no leading v, no prerelease)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ env.VERSION }}
          # Full history and every branch, so the next steps can see origin/master.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag v${{ env.VERSION }} is on master
        run: |
          git rev-parse -q --verify refs/remotes/origin/master >/dev/null || { echo "::error::origin/master was not fetched"; exit 1; }
          git merge-base --is-ancestor "refs/tags/v$VERSION^{commit}" refs/remotes/origin/master || { echo "::error::tag v$VERSION is not on origin/master; release only from master"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Pinned exactly, and
      # Dependabot does not bump this pin, so a maintainer does by hand.
      - name: Use npm 11.21.1 (trusted publishing)
        run: |
          npm install --global npm@11.21.1
          npm --version

      - name: package.json version equals the input
        run: |
          actual=$(node -p "require('./package.json').version")
          test "$actual" = "$VERSION" || { echo "::error::package.json says $actual, not $VERSION"; exit 1; }

      # make install runs npm ci with --ignore-scripts, so no dependency's
      # lifecycle script runs in this job.
      - run: make install
      - run: make check

      # Lets a rerun for a version already on npm go straight to the MCP
      # Registry step, so a failed registry publish can be retried. 200 means
      # published, 404 means not; anything else fails the step.
      - name: Check whether npm has the version
        id: npm_state
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/blowhorn-mcp/$VERSION") || { echo "::error::could not reach the npm registry"; exit 1; }
          case "$code" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::npm already has blowhorn-mcp $VERSION; skipping npm publish and publishing only to the MCP Registry"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::npm registry answered HTTP $code for blowhorn-mcp $VERSION, expected 200 or 404"
              exit 1
              ;;
          esac

      # Skipped when npm already has the version (see the check above), since
      # npm publish would fail on it.
      - name: Publish
        if: steps.npm_state.outputs.published != 'true'
        run: npm publish --provenance --access public

      # Dependabot does not bump this pin, so a maintainer raises it by hand
      # (like the npm pin above).
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher

      - name: server.json versions equal the input
        run: |
          node -e '
            const s = require("./server.json");
            const v = process.env.VERSION;
            const p = s.packages && s.packages[0] && s.packages[0].version;
            if (s.version !== v || p !== v) {
              console.log("::error::server.json says version " + s.version + " and packages[0].version " + p + ", not " + v);
              process.exit(1);
            }
          '

      # The registry looks the package up on npm, and a version just published
      # can take a moment to be served (the first run got a 400 "version not
      # found" one second after npm publish). Poll every 15 seconds for up to
      # 10 minutes until npm answers 200.
      - name: Wait for npm to serve v${{ env.VERSION }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/blowhorn-mcp/$VERSION" >/dev/null; then
              echo "npm serves blowhorn-mcp $VERSION"
              exit 0
            fi
            echo "npm does not serve blowhorn-mcp $VERSION yet (attempt $i of 40)"
            sleep 15
          done
          echo "::error::npm did not serve blowhorn-mcp $VERSION within 10 minutes"
          exit 1

      # The registry accepts the io.github.blowhorn-ai/* namespace from this
      # org's OIDC token and checks npm's mcpName, which is why this runs
      # after npm publish. Run from the repo root, which holds server.json.
      - name: Publish to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish
