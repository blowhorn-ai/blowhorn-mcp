name: Publish to npm

# Started by `make publish` after `make release` created tag v<version>.
# Publishes with provenance through npm trusted publishing (OIDC): npm trusts
# this workflow file in the `npm` environment, so no token is stored.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v (the tag v<version> must exist)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # A dispatch runs the workflow file from the branch it names, so refuse
      # anything but master outright rather than skip quietly. The `npm`
      # environment's deployment branch rule enforces the same thing.
      - name: Require master
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/master ]; then
            echo "::error::publish runs only from master, not $REF; dispatch it with --ref master"
            exit 1
          fi

      - name: Check the version input
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not X.Y.Z (no leading v)"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/v${{ env.VERSION }}
          # Full history and every branch, so the next steps can see origin/master.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exactly tag v${{ env.VERSION }}
        run: |
          tag_commit=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}") || { echo "::error::tag v$VERSION does not exist"; exit 1; }
          test "$(git rev-parse HEAD)" = "$tag_commit" || { echo "::error::HEAD is not tag v$VERSION"; exit 1; }

      - name: Tag v${{ env.VERSION }} is on master
        run: |
          git rev-parse -q --verify refs/remotes/origin/master >/dev/null || { echo "::error::origin/master was not fetched"; exit 1; }
          git merge-base --is-ancestor "refs/tags/v$VERSION^{commit}" refs/remotes/origin/master || { echo "::error::tag v$VERSION is not on origin/master; release only from master"; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Require npm 11.5.1 or later (trusted publishing)
        run: |
          at_least() { node -e 'const [a,b]=process.argv.slice(1).map(v=>v.split(".").map(Number));for(let i=0;i<3;i++){if(a[i]!==b[i])process.exit(a[i]>b[i]?0:1)}' "$1" 11.5.1; }
          if ! at_least "$(npm --version)"; then
            echo "npm $(npm --version) is older than 11.5.1; installing npm 11"
            npm install --global npm@11
          fi
          at_least "$(npm --version)" || { echo "::error::npm $(npm --version) is older than 11.5.1, which trusted publishing needs"; exit 1; }
          npm --version

      - name: package.json version equals the input
        run: |
          actual=$(node -p "require('./package.json').version")
          test "$actual" = "$VERSION" || { echo "::error::package.json says $actual, not $VERSION"; exit 1; }

      - run: make install
      - run: make check

      - name: Refuse a version already on npm
        run: |
          existing=$(npm view "blowhorn-mcp@$VERSION" version 2>/dev/null || true)
          if [ "$existing" = "$VERSION" ]; then
            echo "::error::blowhorn-mcp@$VERSION is already on npm"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public

      - name: Confirm on npm
        run: |
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "blowhorn-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "blowhorn-mcp@$VERSION is on npm"
              exit 0
            fi
            echo "not visible yet (attempt $attempt); waiting"
            sleep 20
          done
          echo "::error::blowhorn-mcp@$VERSION did not appear on npm"
          exit 1
